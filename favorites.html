    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorites • Play Pulse</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ANIMATED BACKGROUND -->

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>


    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>PLAY PULSE</h2>
            <span>Apex Games</span>
        </div>


        <div class="sidebar-title">
            Main
        </div>


        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>


        <a href="games.html" class="nav-item">
            <span class="nav-icon">🎮</span>
            <span>Games</span>
        </a>


        <a href="featured.html" class="nav-item">
            <span class="nav-icon">⭐</span>
            <span>Featured</span>
        </a>


        <a href="popular.html" class="nav-item">
            <span class="nav-icon">🔥</span>
            <span>Popular</span>
        </a>


        <div class="sidebar-title">
            Library
        </div>


        <a href="recent.html" class="nav-item">
            <span class="nav-icon">🕘</span>
            <span>Recently Played</span>
        </a>


        <a href="favorites.html" class="nav-item active">
            <span class="nav-icon">❤️</span>
            <span>Favorites</span>
        </a>


        <div class="sidebar-title">
            More
        </div>


        <a href="settings.html" class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
        </a>


        <a href="about.html" class="nav-item">
            <span class="nav-icon">ℹ️</span>
            <span>About</span>
        </a>


        <!-- SOUND -->
        <button class="sound-control" id="soundControl">

            <span id="soundIcon">
                🔊
            </span>

            <span id="soundText">
                Sound On
            </span>

        </button>


        <div class="sidebar-footer">

            <strong>APEX GAMES</strong>

            <br>

            Play Pulse

            <br>

            Gaming Portal

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <section class="page">

            <div class="page-header">

                <h1>
                    Favorites
                </h1>

                <p>
                    Your favorite games, all in one place.
                </p>

            </div>


            <!-- FAVORITE GAMES -->
            <div
                class="game-grid"
                id="favoriteGames"
            >

                <!-- JavaScript will add favorites here -->

            </div>


            <!-- EMPTY STATE -->
            <div
                class="info-box"
                id="emptyFavorites"
            >

                <div class="big-icon">
                    ❤️
                </div>

                <h2>
                    No Favorites Yet
                </h2>

                <p>
                    Favorite a game and it will appear here.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>


    <script>

        const favoriteContainer =
            document.getElementById("favoriteGames");

        const emptyFavorites =
            document.getElementById("emptyFavorites");


        const favorites =
            JSON.parse(
                localStorage.getItem(
                    "playPulseFavorites"
                )
            ) || [];


        if (favorites.length > 0) {

            emptyFavorites.style.display = "none";


            favorites.forEach(
                gameName => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "game-card";


                    card.innerHTML = `

                        <div class="game-icon">
                            ❤️
                        </div>

                        <h3>
                            ${gameName}
                        </h3>

                        <p>
                            Added to favorites
                        </p>

                        <button class="play-button">
                            Play
                        </button>

                    `;


                    favoriteContainer.appendChild(
                        card
                    );

                }
            );

        }

    </script>

</body>

</html>
