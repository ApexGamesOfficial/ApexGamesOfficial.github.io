<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apex Games Arcade</title>
    <style>
        body { background-color: #121214; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00ff88; text-transform: uppercase; letter-spacing: 2px; margin-top: 40px; }
        p { color: #aaa; margin-bottom: 40px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .game-card { background-color: #1a1a1e; border: 2px solid #2a2a30; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .game-card h3 { color: #00ff88; margin-top: 0; font-size: 20px; }
        .game-frame { border: none; border-radius: 8px; background: #000; width: 100%; height: 400px; }
    </style>
</head>
<body>

    <h1>🎮 Apex Games Official Arcade 🎮</h1>
    <p>Welcome to our official studio game hub! Unblocked and ready to play.</p>

    <div class="grid-container">
        <!-- GAME 1 -->
        <div class="game-card">
            <h3>Space Invaders Classic</h3>
            <iframe class="game-frame" src="https://mit.edu" allowtransparency="true" scrolling="no" allowfullscreen></iframe>
        </div>

        <!-- GAME 2 -->
        <div class="game-card">
            <h3>Retro Snake</h3>
            <iframe class="game-frame" src="https://mit.edu" allowtransparency="true" scrolling="no" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
