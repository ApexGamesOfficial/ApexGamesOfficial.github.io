<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Pulse</title>

    <style>
        :root {
            --pulse-blue: #168CFF;
            --pulse-blue-light: #38A7FF;
            --background: #06070a;
            --sidebar: #0b0e15;
            --card: #0d0f17;
            --border: #1a2238;
            --text: #ffffff;
            --muted: #718096;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        .animated-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(22, 140, 255, 0.07);
            filter: blur(90px);
            animation: floatingGlow 14s ease-in-out infinite alternate;
        }

        .glow-1 {
            top: -180px;
            left: 15%;
        }

        .glow-2 {
            right: -150px;
            bottom: -150px;
            animation-delay: -5s;
        }

        .glow-3 {
            top: 45%;
            left: 50%;
            animation-delay: -9s;
        }

        .particles span {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--pulse-blue);
            box-shadow: 0 0 10px rgba(22, 140, 255, 0.8);
            opacity: 0.35;
            animation: floatParticle linear infinite;
        }

        .particles span:nth-child(1) {
            left: 8%;
            animation-duration: 14s;
        }

        .particles span:nth-child(2) {
            left: 18%;
            animation-duration: 19s;
        }

        .particles span:nth-child(3) {
            left: 29%;
            animation-duration: 12s;
        }

        .particles span:nth-child(4) {
            left: 40%;
            animation-duration: 21s;
        }

        .particles span:nth-child(5) {
            left: 51%;
            animation-duration: 16s;
        }

        .particles span:nth-child(6) {
            left: 62%;
            animation-duration: 18s;
        }

        .particles span:nth-child(7) {
            left: 72%;
            animation-duration: 13s;
        }

        .particles span:nth-child(8) {
            left: 82%;
            animation-duration: 20s;
        }

        .particles span:nth-child(9) {
            left: 91%;
            animation-duration: 15s;
        }

        .particles span:nth-child(10) {
            left: 55%;
            animation-duration: 23s;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 245px;
            height: 100vh;

            padding: 25px 16px;

            background: rgba(11, 14, 21, 0.94);
            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            z-index: 1000;

            backdrop-filter: blur(18px);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h2 {
            margin: 0;
            color: var(--pulse-blue);

            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;

            text-shadow:
                0 0 15px rgba(22, 140, 255, 0.4);
        }

        .logo span {
            display: block;
            margin-top: 4px;

            color: #56657a;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sidebar-title {
            margin: 18px 12px 8px;

            color: #4d5b70;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 12px 14px;
            margin: 4px 0;

            border-radius: 10px;

            color: #aeb9c9;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(22, 140, 255, 0.10);
            color: #ffffff;
            transform: translateX(3px);
        }

        .nav-item.active {
            background: rgba(22, 140, 255, 0.16);
            color: var(--pulse-blue-light);

            box-shadow:
                inset 3px 0 0 var(--pulse-blue);
        }

        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }

        .sidebar-footer {
            margin-top: auto;

            padding: 14px;

            border-top: 1px solid var(--border);

            color: #4f5d71;

            font-size: 11px;
            line-height: 1.5;
        }

        .sidebar-footer strong {
            color: #73849b;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            margin-left: 245px;
            min-height: 100vh;
            position: relative;
        }

        /* =========================
           HOME SCREEN
        ========================= */

        .home-screen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .home-logo {
            animation:
                logoAppear 1.2s
                cubic-bezier(0.16, 1, 0.3, 1);
        }

        .home-logo h1 {
            margin: 0;

            font-size: clamp(55px, 8vw, 105px);

            font-weight: 1000;
            letter-spacing: 10px;

            text-transform: uppercase;

            background:
                linear-gradient(
                    135deg,
                    #38A7FF,
                    #168CFF,
                    #0757B8
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(22, 140, 255, 0.35)
                );
        }

        .home-logo p {
            margin-top: 10px;

            color: #65758b;

            font-size: 14px;
            letter-spacing: 5px;

            text-transform: uppercase;
        }

        .home-line {
            width: 100px;
            height: 2px;

            margin: 25px auto;

            background: var(--pulse-blue);

            box-shadow:
                0 0 15px
                rgba(22, 140, 255, 0.7);

            animation: linePulse 2.5s ease-in-out infinite;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes floatingGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(80px, -60px) scale(1.15);
            }

            100% {
                transform: translate(-50px, 50px) scale(0.95);
            }
        }

        @keyframes floatParticle {
            0% {
                top: 110vh;
                opacity: 0;
            }

            15% {
                opacity: 0.4;
            }

            85% {
                opacity: 0.4;
            }

            100% {
                top: -10vh;
                opacity: 0;
            }
        }

        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.85);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes linePulse {
            0%, 100% {
                opacity: 0.4;
                transform: scaleX(0.7);
            }

            50% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo h2 {
                font-size: 0;
            }

            .logo h2::after {
                content: "P";
                font-size: 24px;
            }

            .logo span,
            .sidebar-title,
            .nav-item span:not(.nav-icon),
            .sidebar-footer {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 13px 5px;
            }

            .main-content {
                margin-left: 70px;
            }

            .home-logo h1 {
                font-size: 45px;
                letter-spacing: 5px;
            }

            .home-logo p {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================

    <div class="animated-background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <div class="particles">

            <span></span>

            <span></span>
            <span></span>
            <span></span>

            <span></span>
